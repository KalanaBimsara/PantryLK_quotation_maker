[build]
  command = "npm run build"

[build.environment]
  # Supabase URL and publishable key are public by design (NEXT_PUBLIC_*) and
  # get inlined into the client bundle, so exclude them from secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
